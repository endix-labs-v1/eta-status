<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eta status</title>
<meta name="description" content="Whether the eta API, app, MCP server, live stream and docs are up, with 90 days of history.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0c0c0d;
    --text: #ececee;
    --muted: #8a8a92;
    --pink: #ffbad4;
    --up: #2ec27e;
    --down: #e5484d;
    --slow: #e8a33d;
    --line: #232327;
    --empty: #2a2a2f;
    --r: 2px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  a { color: inherit; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 0 32px; }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .logo img { height: 22px; width: auto; display: block; }
  .logo .fallback { color: var(--pink); font-weight: 700; font-size: 22px; line-height: 22px; }
  .logo .label { color: var(--muted); font-size: 15px; }
  nav { display: flex; gap: 18px; font-size: 14px; }
  nav a { color: var(--muted); text-decoration: none; }
  nav a:hover { color: var(--text); }

  .overall { border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; }
  .overall h1 { margin: 0; font-size: 19px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .overall p { margin: 4px 0 0 20px; color: var(--muted); font-size: 13px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--empty); flex: none; }
  .ok .dot, .s-up .dot { background: var(--up); }
  .bad .dot, .s-down .dot { background: var(--down); }
  .warn .dot, .s-degraded .dot { background: var(--slow); }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin: 32px 0 10px; gap: 12px; }
  .toolbar h2 { margin: 0; }
  h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .seg button {
    font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0;
    padding: 5px 12px; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { color: var(--text); background: var(--line); }

  .services { border: 1px solid var(--line); border-radius: var(--r); }
  .svc { padding: 16px 18px; }
  .svc + .svc { border-top: 1px solid var(--line); }
  .svc .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
  .svc .name { font-weight: 600; }
  .state { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; }
  .state .dot { width: 8px; height: 8px; }
  .state .ms { color: var(--muted); font-size: 13px; }
  .s-notlive, .s-nodata { color: var(--muted); }

  .bar { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 2px; height: 32px; cursor: default; }
  .bar.fine { gap: 0; }
  .bar span { background: var(--empty); border-radius: 1px; }
  .bar.fine span { border-radius: 0; }
  .bar span.up { background: var(--up); }
  .bar span.degraded { background: var(--slow); }
  .bar span.down { background: var(--down); }
  .bar span.sel { outline: 1px solid var(--text); outline-offset: 1px; }
  .foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .foot .mid { text-align: center; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .foot .end { flex: none; }

  .incidents { margin-top: 40px; }
  .incidents h2 { margin: 0 0 12px; }
  .inc { border-top: 1px solid var(--line); padding: 16px 0; }
  .inc:last-child { border-bottom: 1px solid var(--line); }
  .inc .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--muted); }
  .inc .status { color: var(--slow); }
  .inc .status.resolved { color: var(--up); }
  .inc h3 { margin: 4px 0 6px; font-size: 16px; font-weight: 600; }
  .inc p { margin: 6px 0; }
  .inc ul { margin: 6px 0; padding-left: 18px; color: var(--muted); }
  .inc li { margin: 2px 0; }
  .none { color: var(--muted); margin: 0; }

  footer { margin-top: 40px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 18px; }
  footer nav { font-size: 13px; }

  @media (max-width: 520px) {
    header { padding-bottom: 24px; }
    .overall h1 { font-size: 17px; }
    .svc { padding: 14px 12px; }
    .bar { gap: 1px; height: 28px; }
    .bar.fine { gap: 0; }
    .bar span { border-radius: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="https://www.eta.cash/">
      <img src="https://www.eta.cash/brand/eta-wordmark.png" alt="eta" height="22"
           onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fallback',textContent:'eta'}))">
      <span class="label">status</span>
    </a>
    <nav>
      <a href="https://www.eta.cash/">App</a>
      <a href="https://eta-cash.gitbook.io/api">Docs</a>
    </nav>
  </header>

  <section class="overall" id="overall" aria-live="polite">
    <h1><span class="dot"></span><span id="overall-text">Loading status</span></h1>
    <p id="overall-sub">&nbsp;</p>
  </section>

  <div class="toolbar">
    <h2>Services</h2>
    <div class="seg" role="group" aria-label="Time range">
      <button type="button" data-range="days" aria-pressed="true">90 days</button>
      <button type="button" data-range="hours" aria-pressed="false">24 hours</button>
    </div>
  </div>
  <div class="services" id="services"></div>

  <section class="incidents">
    <h2>Incidents</h2>
    <div id="incidents"><p class="none">Loading incidents</p></div>
  </section>

  <footer>
    <span>Checked every 5 minutes from GitHub Actions. Times are UTC.</span>
    <nav>
      <a href="https://www.eta.cash/">App</a>
      <a href="https://eta-cash.gitbook.io/api">Docs</a>
      <a href="https://github.com/endix-labs-v1/eta-status">Source</a>
    </nav>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
